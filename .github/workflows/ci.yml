name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: incidents
          POSTGRES_USER: incidents
          POSTGRES_PASSWORD: incidents
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U incidents -d incidents"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: Run migrations
        working-directory: backend
        env:
          DATABASE_URL: sqlite+aiosqlite:///./data/ci-incidents.db
          API_KEYS: local-dev-token:admin
        run: alembic upgrade head
      - name: Run Postgres migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://incidents:incidents@127.0.0.1:5432/incidents
          API_KEYS: local-dev-token:admin
        run: alembic upgrade head
      - name: Run backend tests
        working-directory: backend
        env:
          API_KEYS: local-dev-token:admin
        run: pytest
      - name: Build backend image
        run: docker build -t incident-backend ./backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_URL: http://127.0.0.1:8001/api/v1
        run: npm run build
      - name: Build frontend image
        run: docker build --build-arg VITE_API_URL=http://127.0.0.1:8001/api/v1 -t incident-frontend ./frontend
