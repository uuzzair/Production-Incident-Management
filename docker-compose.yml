services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: incidents
      POSTGRES_USER: incidents
      POSTGRES_PASSWORD: incidents
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U incidents -d incidents"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    ports:
      - "8082:8080"
    volumes:
      - ./keycloak/realms:/opt/keycloak/data/import:ro
    command: ["start-dev", "--import-realm"]

  backend:
    build:
      context: ./backend
    environment:
      ENVIRONMENT: local
      DATABASE_URL: postgresql+asyncpg://incidents:incidents@postgres:5432/incidents
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080,http://127.0.0.1:8080
      CORS_ALLOW_CREDENTIALS: "true"
      API_KEYS: local-dev-token:admin
      OIDC_ISSUER_URL: http://127.0.0.1:8082/realms/incidents-local
      OIDC_BACKCHANNEL_ISSUER_URL: http://host.docker.internal:8082/realms/incidents-local
      OIDC_CLIENT_ID: fastapi-incidents
      OIDC_CLIENT_SECRET: local-keycloak-secret
      OIDC_REDIRECT_URI: http://127.0.0.1:8001/api/v1/auth/callback
      OIDC_AUTHORIZATION_URL: http://127.0.0.1:8082/realms/incidents-local/protocol/openid-connect/auth
      AUTH_SUCCESS_REDIRECT_URL: http://127.0.0.1:8080
      SESSION_SECRET_KEY: local-compose-session-secret-change-me
      SECURE_COOKIES: "false"
    ports:
      - "8001:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://127.0.0.1:8001/api/v1
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
